<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b2d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kuusikko Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen 3D course; frosted scorecard top-left, wind + course map top-right, club / swing meter / hit button docked at the bottom. Single deliberate look over a sky-and-forest scene. */
:root{
  --panel:rgba(14,32,22,.78); --line:rgba(244,240,227,.16); --ink:#f4f0e3; --muted:#b6cbb9;
  --flag:#ef5b3c; --flagDark:#c9432a; --gold:#f2c14e; --sky:#a9d4ef;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.info{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;padding:7px 11px 8px}
.info .row{display:flex;gap:10px;align-items:center}
.info .no{font-family:var(--display);font-weight:800;font-size:34px;line-height:.85;min-width:1ch}
.info .meta{display:flex;flex-direction:column;font-size:11px;color:var(--muted);line-height:1.3;font-variant-numeric:tabular-nums}
.info .meta b{color:var(--ink);font-weight:700}
.info .dist{margin-left:auto;padding-left:8px;border-left:1px solid var(--line);text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.score{font-family:var(--display);font-weight:800;font-size:20px;line-height:1;padding:3px 7px;border-radius:7px;background:rgba(244,240,227,.1);font-variant-numeric:tabular-nums;min-width:1.6em;text-align:center}
.score.under{background:rgba(239,91,60,.85);color:#fff}.score.over{background:rgba(95,183,207,.3)}
.elev{font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.elev.up{color:#f2a27e}.elev.dn{color:#8fd0e2}
.lietile{position:relative;flex:none}
.pct{position:absolute;left:0;bottom:0;width:31%;text-align:center;font-size:9.5px;font-weight:800;color:#fff;background:rgba(10,22,15,.72);border-radius:0 0 6px 6px;padding:1px 0;font-variant-numeric:tabular-nums;white-space:nowrap}
.pct.lo{color:#ffb39f}
.fly{position:fixed;left:0;top:0;pointer-events:none;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1;color:#f4f0e3;text-align:center;background:rgba(14,32,22,.82);padding:4px 12px 5px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.25);
  transform:translate(0,-50%);white-space:nowrap;opacity:0;transition:opacity .2s;font-variant-numeric:tabular-nums;z-index:2}
.fly.on{opacity:1}.fly small{display:block;font-family:var(--body);font-size:14px;font-weight:700;text-align:center;color:rgba(244,240,227,.9);margin-top:2px}
.lbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block}
.val{font-family:var(--display);font-weight:600;font-size:21px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:420px){.info .val{font-size:18px}.score{font-size:17px;padding:2px 5px}.info .row{gap:7px}}
.lierow{display:flex;gap:8px;align-items:center}
#lieCv{display:block;width:150px;height:46px;flex:none}
@media (max-width:420px){#lieCv{width:126px;height:39px}}
.lietxt{min-width:0;max-width:170px}
.lie{font-size:11.5px;font-weight:600;color:var(--gold);line-height:1.3}
.hint{font-size:11px;color:var(--muted);line-height:1.3;margin-top:1px}
@media (max-width:420px){.hint{display:none}.info{max-width:calc(100vw - 150px);box-sizing:border-box}.lierow{flex-wrap:wrap;gap:4px 8px}.lietxt{max-width:none}}
.side{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.wind{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px}
.wind svg{width:28px;height:28px}
.wind .val{font-size:18px}
#wArrow{transition:transform .3s;transform-origin:20px 20px}
.iconrow{display:flex;flex-direction:column;gap:6px;align-self:flex-end}
.ib[aria-pressed="true"].eye{background:rgba(242,193,78,.9);color:#1d2a20}
body.freecam .panel,body.flying .panel{opacity:0;pointer-events:none;transform:translate(-50%,24px)}
.freebar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;z-index:5;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
.freebar button{font:700 14px var(--body);padding:10px 14px;border-radius:999px;border:0;background:rgba(14,32,22,.86);color:#f4f0e3;cursor:pointer}
.freebar button.go{background:#f2c14e;color:#1d2a20}
.freebar .fhint{flex-basis:100%;text-align:center;font:600 12px var(--body);color:#f4f0e3;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.skipfly{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font:700 14px var(--body);padding:10px 16px;border-radius:999px;border:0;background:rgba(14,32,22,.8);color:#f4f0e3;z-index:5}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:0}
.ib svg{width:20px;height:20px}
.ib:hover{background:rgba(30,60,42,.92)}
#sndBtn .off{display:none}#sndBtn[aria-pressed="false"] .off{display:inline}#sndBtn[aria-pressed="false"] .on{display:none}#sndBtn[aria-pressed="false"]{color:var(--muted)}
.tabs{display:flex;gap:6px;background:#e9e2cc;border-radius:10px;padding:4px}
.tabs button{flex:1;padding:8px;border-radius:8px;background:none;color:#4b5b4e;font-weight:700;font-size:14px}
.tabs button[aria-pressed="true"]{background:#1f3a29;color:#f7f2e2}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;max-height:min(46vh,380px);overflow-y:auto}
.hcell{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:10px;background:#fff;color:#1b2a1f;border:2px solid #ddd3b8;font-variant-numeric:tabular-nums}
.hcell:hover{border-color:#1f3a29}
.hcell.cur{border-color:var(--flag)}
.hcell b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1}
.hcell span{font-size:11px;color:#6c786e}
.hcell i{font-style:normal;font-size:11px;font-weight:700;color:var(--flagDark)}
.note{font-size:12.5px;color:#6c786e;text-align:center}
#mini{display:block;border-radius:10px;border:1px solid var(--line);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.panel.away{opacity:0;transform:translate(-50%,16px);pointer-events:none}
/* ohjauspalkki: yksi rivi leveällä näytöllä, kaksi kapealla */
.panel{transition:opacity .25s,transform .25s;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));
  width:min(640px,calc(100% - 2 * max(12px,env(safe-area-inset-left,0px))));box-sizing:border-box;padding:6px;
  display:grid;grid-template-columns:auto minmax(120px,auto) 1fr auto auto;grid-template-areas:"l club hit opt r";gap:6px;align-items:stretch}
#aL{grid-area:l}#aR{grid-area:r}.club{grid-area:club}.hit{grid-area:hit}.opt{grid-area:opt}
@media (max-width:560px){.panel{grid-template-columns:auto 1fr auto;grid-template-areas:"club club opt" "l hit r"}}
button{font-family:var(--body);border:0;cursor:pointer;color:var(--ink);touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sq{width:42px;min-height:42px;border-radius:9px;background:rgba(244,240,227,.08);display:grid;place-items:center;padding:0}
.sq svg{width:20px;height:20px}
.sq:hover,.cs:hover,.opt:hover{background:rgba(244,240,227,.16)}
.sq:active,.cs:active{background:rgba(244,240,227,.26)}
.club{display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.22);border-radius:9px;padding:2px}
.cs{width:26px;align-self:stretch;border-radius:7px;background:none;font-size:20px;font-weight:700;color:var(--muted)}
.club .mid{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;padding:2px 2px}
.club b{font-family:var(--display);font-size:18px;font-weight:800;line-height:1;letter-spacing:.02em;white-space:nowrap}
.club span{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt{border-radius:9px;background:rgba(0,0,0,.22);padding:3px 10px;text-align:left;display:flex;flex-direction:column;justify-content:center;font-size:12px;font-weight:600;white-space:nowrap}
.opt[aria-expanded="true"]{background:rgba(244,240,227,.18)}
.shotpop{position:absolute;bottom:calc(100% + 8px);right:0;display:grid;gap:6px;padding:10px;width:min(300px,calc(100vw - 32px));box-sizing:border-box}
.shotopts{display:flex;flex-direction:column;gap:4px}
.shotopts button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:7px 10px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid transparent}
.shotopts button b{font-size:13.5px}
.shotopts button span{font-size:11.5px;color:var(--muted)}
.shotopts button[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,193,78,.12)}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1 1 auto;min-width:0;padding:7px 4px;border-radius:6px;background:none;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:rgba(244,240,227,.18);color:var(--ink)}
/* lyöntinappi on samalla voimamittari */
.hit{position:relative;min-height:44px;border-radius:9px;background:var(--flag);overflow:hidden;padding:0}
.hit:hover{background:var(--flagDark)}
.hit:disabled{background:rgba(244,240,227,.1);color:var(--muted);cursor:default}
.hitlbl{position:relative;z-index:3;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.meter{position:absolute;inset:0;background:#1b2d22;opacity:0;transition:opacity .15s}
.panel.swinging .meter{opacity:1}
/* selkeät reunat: kehys ja täyden voiman päätypalkki näkyvät mittarin päällä, jotta reunan lähestyminen on helppo nähdä */
.hit::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid rgba(255,255,255,.35);pointer-events:none;z-index:4}
.panel.swinging .hit::after{border:3px solid #f4f0e3;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.hit::before{content:"";position:absolute;top:0;bottom:0;right:0;width:7px;z-index:4;pointer-events:none;opacity:0;
  background:repeating-linear-gradient(45deg,#f4f0e3 0 3px,#ef5b3c 3px 6px);box-shadow:-2px 0 0 rgba(0,0,0,.45)}
.panel.swinging .hit::before{opacity:1}
.panel.perf .hit{box-shadow:0 0 0 2px var(--pc),0 0 22px var(--pc);animation:pflash .45s ease-out}
.panel.perf #mMark{width:18px;margin-left:-9px;background:none;box-shadow:none}
.panel.perf #mMark::after{content:"★";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:20px;color:var(--pc);text-shadow:0 0 8px #000}
@keyframes pflash{0%{filter:brightness(2.2)}100%{filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){.panel.perf .hit{animation:none}}
.meter i{position:absolute;top:0;bottom:0;display:block}
#mDraw{background:#5fb7cf;z-index:1} #mFade{background:#f2c14e;z-index:1} #mPerf{background:#fff;z-index:1}
#mMark{z-index:2}
#mHole{width:3px;margin-left:-1.5px;background:#10140e;box-shadow:0 0 0 1px #fff;z-index:2}
#mHole::after{content:"";position:absolute;top:2px;left:3px;border-left:9px solid #ef5b3c;border-top:4px solid transparent;border-bottom:4px solid transparent}
.pc{width:2px;margin-left:-1px;background:rgba(19,38,27,.55);z-index:1;top:30%!important;bottom:30%!important}
.zl{position:absolute;z-index:2;top:2px;font-size:9px;font-weight:800;color:#13261b;transform:translateX(-50%);font-family:var(--body)}
#mFill{left:0;width:0;opacity:.9}
#mMark{width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 8px #fff}
.tick{width:1px;background:rgba(255,255,255,.2)}
.cut{position:fixed;inset:0;background:#0d1a12;opacity:0;pointer-events:none;z-index:1}
.cut.on{animation:cut .32s ease-out}
@keyframes cut{0%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cut.on{animation:none}}
.toast{position:fixed;left:50%;top:calc(30% + env(safe-area-inset-top,0px));transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;
  font-family:var(--display);font-weight:800;font-size:34px;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.55);transition:opacity .25s,transform .25s;white-space:nowrap}
.rate{position:fixed;left:50%;top:calc(30% + 46px + env(safe-area-inset-top,0px));transform:translate(-50%,0) scale(.9);opacity:0;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 16px;border-radius:999px;background:rgba(14,32,22,.72);border:1px solid var(--rc,#fff);
  transition:opacity .25s,transform .25s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.rate.on{opacity:1;transform:translate(-50%,0) scale(1)}
.rate b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--rc,#fff);line-height:1.05}
.rate span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rate.epic{box-shadow:0 0 26px rgba(181,77,255,.7);background:rgba(40,12,60,.78)}
.rate.epic b{text-shadow:0 0 14px rgba(200,120,255,.9)}
@media (prefers-reduced-motion:reduce){.rate{transition:none}}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast small{display:block;font-family:var(--body);font-size:14px;font-weight:600}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,24,16,.55);z-index:10;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{max-height:calc(100% - 24px);overflow-y:auto;background:#f7f2e2;color:#1b2a1f;border-radius:16px;padding:22px;width:100%;max-width:420px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 50px rgba(0,0,0,.4)}
.card h1,.card h2{font-family:var(--display);font-weight:800;margin:0;line-height:.95;text-wrap:balance}
.card h1{font-size:46px;color:#1f4d2c}
.card h2{font-size:42px;color:var(--flagDark);text-align:center}
.card p{margin:0;color:#4b5b4e;line-height:1.45}
.card ol{margin:0;padding-left:20px;color:#2c3a2f;line-height:1.5;display:flex;flex-direction:column;gap:4px}
.card .cbtn{background:var(--flag);color:#fff;border-radius:10px;padding:12px 16px;font-weight:700;font-size:16px}
.card .cbtn.alt{background:#1f3a29}
.courses{display:flex;flex-direction:column;gap:8px}
.menu{display:flex;flex-direction:column;gap:8px}
.opts{display:flex;flex-direction:column;gap:2px;margin:4px 0 2px}
.sw{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;border:0;border-bottom:1px solid #e3dbc3;background:none;color:#1b2a1f;text-align:left;font:inherit;cursor:pointer}
.sw:last-child{border-bottom:0}
.sw span{flex:1;min-width:0}.sw b{display:block;font-size:15px}.sw small{display:block;font-size:12px;color:#5d6a5f;margin-top:1px}
.sw i{flex:none;position:relative;width:46px;height:28px;border-radius:999px;background:#c9c0a6;transition:background .15s}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-checked="true"] i{background:#2f7a43}.sw[aria-checked="true"] i::after{transform:translateX(18px)}
.card.book{background:none;box-shadow:none;padding:0;max-width:460px;overflow:visible;gap:0;height:min(760px,calc(100% - 24px));max-height:none}
.bk{display:flex;flex-direction:column;height:100%;min-height:0;filter:drop-shadow(0 18px 40px rgba(0,0,0,.45))}
.btabs{display:flex;gap:4px;padding:0 14px 0 26px;position:relative;z-index:1}
.btabs button{flex:1;min-width:0;padding:9px 4px 12px;margin-bottom:-6px;border-radius:10px 10px 0 0;background:color-mix(in srgb,var(--tc) 78%,#000);color:#fff8e8;font:800 14px var(--display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateY(5px);transition:transform .15s,background .15s;box-shadow:inset 0 -6px 8px rgba(0,0,0,.18)}
.btabs button[aria-selected=true]{background:var(--tc);transform:none;box-shadow:none}
.btabs button:hover{transform:translateY(1px)}
.pg{position:relative;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 18px 20px 34px;border-radius:6px 14px 14px 6px;color:#1b2a1f;
  background:linear-gradient(90deg,rgba(80,50,20,.22),rgba(80,50,20,0) 22px),repeating-linear-gradient(transparent 0 27px,rgba(44,79,158,.08) 27px 28px),#f6eed6;
  border-top:6px solid var(--tc);box-shadow:inset 0 0 0 1px rgba(90,60,30,.15),-6px 0 0 #5b3a22,-9px 2px 0 #3e2716,4px 4px 0 #e6dcbe,7px 7px 0 #d9cdaa}
.pg::before{content:'';position:absolute;left:12px;top:0;bottom:0;width:1px;background:rgba(200,67,58,.35)}
.pg.fwd{animation:pgf .32s ease-out}.pg.back{animation:pgb .32s ease-out}
@keyframes pgf{from{transform:perspective(900px) rotateY(-14deg);transform-origin:left;opacity:.4}to{transform:none;opacity:1}}
@keyframes pgb{from{transform:perspective(900px) rotateY(10deg);transform-origin:left;opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pg.fwd,.pg.back{animation:none}}
.bkh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:2px solid rgba(31,77,44,.25);padding-bottom:6px}
.bkh h1{margin:0;font:800 30px/1 var(--display);color:#1f4d2c;letter-spacing:.01em}.bkh span{font-size:12px;color:#7a6f52;font-style:italic;white-space:nowrap}
.pgh{margin:4px 0 -4px;font:800 18px var(--display);color:var(--tc);letter-spacing:.02em}
.chars{display:grid;grid-template-columns:1fr;gap:10px}
.chc{display:grid;grid-template-columns:64px 1fr;grid-template-areas:"img head" "img stats" "tr tr";column-gap:12px;row-gap:6px;align-items:start;padding:10px 12px;border-radius:14px;background:#fffaf0;border:2px solid #ddd3b8;color:#1b2a1f;text-align:left}
.chc img{grid-area:img;width:64px;height:64px;border-radius:50%;object-fit:cover;background:#cfe0ef;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.12)}
.chh{grid-area:head;display:flex;flex-direction:column}.chh b{font:800 19px/1.05 var(--display);letter-spacing:.01em}.chh small{font-size:12px;color:#5d6a5f}
.stats{grid-area:stats;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.st{display:flex;flex-direction:column;gap:2px;min-width:0}.st em{font-style:normal;font-size:9.5px;letter-spacing:-.02em;font-weight:700;color:#7a6f52;white-space:nowrap;overflow:hidden;text-overflow:clip}
.bar{display:block;height:6px;border-radius:3px;background:#e6dcc0;overflow:hidden}.bar i{display:block;height:100%;background:var(--tc,#2f7a43);border-radius:3px}
.tr{grid-area:tr;display:flex;flex-direction:column;gap:3px;font-size:12.5px;line-height:1.3}

.tr .pl::before{content:'+';color:#2f7a43}.tr .mi::before{content:'−';color:#c8433a}.tr .nn{padding-left:0;color:#7a6f52}.tr .nn::before{content:none}

// Rakentaa Mixamo-golfarin three.js:n perusluokista (SkinnedMesh, Skeleton, AnimationClip) muunnetusta datasta
function buildGolferModel(meta,buf,map){
  const bones=meta.bones.map(b=>{const o=new THREE.Bone();o.name=b.n;o.position.fromArray(b.t);o.quaternion.fromArray(b.q);return o});
  const root=new THREE.Group();meta.bones.forEach((b,i)=>{(b.p>=0?bones[b.p]:root).add(bones[i])});
  // lepoasento on sama kuin sidonta-asento, joten käänteismatriisit lasketaan suoraan luista (sisältää koon skaalauksen)
  root.scale.setScalar(meta.unit);root.updateMatrixWorld(true);
  const skel=new THREE.Skeleton(bones);const meshes=[];
  for(const m of meta.meshes){const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(buf,m.pos,m.n*3),3));
    g.setAttribute('normal',new THREE.BufferAttribute(new Int8Array(buf,m.nrm,m.n*4),4,true));
    g.setAttribute('skinIndex',new THREE.BufferAttribute(new Uint8Array(buf,m.si,m.n*4),4));
    g.setAttribute('skinWeight',new THREE.BufferAttribute(new Uint8Array(buf,m.sw,m.n*4),4,true));
    g.setIndex(new THREE.BufferAttribute(m.i32?new Uint32Array(buf,m.idx,m.ni):new Uint16Array(buf,m.idx,m.ni),1));
    const mp=m.tex&&map&&!map.isTexture?map[m.tex]:(map&&map.isTexture?map:null); // osakohtainen tekstuuri (monitekstuuriset hahmot)
    if(m.uv>=0&&mp)g.setAttribute('uv',new THREE.BufferAttribute(new Uint16Array(buf,m.uv,m.n*2),2,true));
    const mat=new THREE.MeshPhongMaterial({color:mp?0xffffff:new THREE.Color().fromArray(m.color),map:mp||null,shininess:mp?12:25,skinning:true,
      transparent:false,alphaTest:m.alpha?.45:0,side:m.alpha?THREE.DoubleSide:THREE.FrontSide});
    const sm=new THREE.SkinnedMesh(g,mat);sm.name=m.name;sm.castShadow=true;sm.frustumCulled=false;root.add(sm);meshes.push(sm)}
  root.updateMatrixWorld(true);meshes.forEach(sm=>sm.bind(skel));
  const clips={};
  for(const c of meta.clips){const times=new Float32Array(c.frames);for(let i=0;i<c.frames;i++)times[i]=i/c.fps;const tr=[];
    for(const t of c.tracks){const nm=bones[t.b].name;
      if(t.p==='q'){const raw=new Int16Array(buf,t.o,c.frames*4),v=new Float32Array(c.frames*4);for(let i=0;i<v.length;i++)v[i]=raw[i]/32767;
        tr.push(new THREE.QuaternionKeyframeTrack(nm+'.quaternion',times,v))}
      else tr.push(new THREE.VectorKeyframeTrack(nm+'.position',times,new Float32Array(buf,t.o,c.frames*3).slice()))}
    clips[c.name]=new THREE.AnimationClip(c.name,(c.frames-1)/c.fps,tr)}
  return {root,bones,skel,meshes,clips,bone:n=>bones.find(b=>b.name===n)};
}

function makeClub(kind,len){const g=new THREE.Group(),steel=new THREE.MeshPhongMaterial({color:0xd5d8dc,shininess:90}),dark=new THREE.MeshPhongMaterial({color:0x22252a,shininess:40});
  const grip=new THREE.Mesh(new THREE.CylinderGeometry(.013,.011,.26,8),dark);grip.position.y=.13;g.add(grip);
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(.0065,.0045,len-.26,6),steel);sh.position.y=.26+(len-.26)/2;g.add(sh);

// ajetaan sama fysiikka etukäteen ilman ääniä ja ilmoituksia; fysiikka etenee kiintein askelin, joten tulos on sama kuin oikeassa lennossa

// 1) sivupudotus kahden mailanmitan päähän esteeseen menokohdasta, ei lähemmäs reikää

     <div class="courses">${opts.map(o=>`<button class="course" type="button" data-o="${o[0]}"><b>${o[1]}</b><span>${o[2]}<br>${info(o[3])}</span></button>`).join('')}</div>`);

      Object.assign(b,{x:P.x,y:P.y,h:terrain(P.x,P.y),vx:0,vy:0,vh:0,air:false});hideOverlay();S.state='settle';S.timer=.15;snapCamera();
      toast(o[1],info(P),1600)})},900);
}

    // kasvojen suunta lasketaan hartioista joka hetki: voittotanssi kääntää hahmoa eri suuntaan kuin puttiasento

    const cx=W.x-fx*back,cy=-(W.z+fy*back);tmpV.set(cx,Math.max(W.y*.6+4,terrain(cx,cy)+2),-cy);tmpL.copy(W);

function cpuScore(h){ // tietokoneen tulos: odotettu ylitys + väylän vaikeus (HCP) + satunnaisuus
  const base=CPU[GAME.diff].over+(h.hcp?(9.5-h.hcp)*.04:0),r=Math.random()+Math.random()+Math.random()-1.5;
  return Math.max(1,Math.min(MAXST,Math.round(h.par+base+r*1.1)))}
function setPlayer(i){GAME.cur=i;S.scores=GAME.players[i].scores;SHIRT.color.setHex(GAME.players[i].shirt);if(GOLF.on)GOLF.tint()}
function resetRound(){S.roundPerfect=0;S.roundFull=0;S.streak=0;S.straightRun=0;GAME.players.forEach(p=>p.scores=[]);GAME.cpu=[];setPlayer(0)}
const fmtD=d=>d===0?'E':d>0?'+'+d:''+d;

// ---------- tuloskortti ----------
function table(){
  const rows=[];if(GAME.mode==='duo')GAME.players.forEach((p,i)=>rows.push({l:p.name,s:p.scores,me:i===GAME.cur}));
  else{rows.push({l:'Sinä',s:S.scores,me:true});if(GAME.mode==='cpu')rows.push({l:'Tietokone',s:GAME.cpu})}
  const half=(from,to,lbl)=>{let h='<tr><th>Väylä</th>',hc='<tr><td class="l">HCP</td>',p='<tr><td class="l">Par</td>',tp=0;
    for(let i=from;i<to;i++){const x=HOLES[i];h+=`<th>${i+1}</th>`;hc+=`<td>${x.hcp||''}</td>`;p+=`<td>${x.par}</td>`;tp+=x.par}
    let body='';const tots=rows.map(r=>{let line=`<tr><td class="l">${r.l}</td>`,ts=0,any=false;
      for(let i=from;i<to;i++){const v=r.s[i],x=HOLES[i];if(v!=null){any=true;ts+=v;line+=`<td class="${v<x.par?'u':v>x.par?'o':''}">${v}</td>`}else line+='<td>–</td>'}
      body+=line+`<td><b>${any?ts:'–'}</b></td></tr>`;return any?ts:null});
    return {html:h+`<th>${lbl}</th></tr>`+(HOLES[from].hcp?hc+'<td></td></tr>':'')+p+`<td><b>${tp}</b></td></tr>`+body,tp,tots}};
  if(HOLES.length<=9){const t=half(0,HOLES.length,'Yht');return `<div class="tw"><table>${t.html}</table></div>`}
  const o=half(0,9,'Out'),n=half(9,HOLES.length,'In');
  return `<div class="tw"><table>${o.html}</table></div><div class="tw"><table>${n.html}</table></div>
    <p style="text-align:center;margin:0">Yhteensä: par ${o.tp+n.tp}${rows.map((r,i)=>{const a=o.tots[i],b=n.tots[i];return ' · '+r.l.toLowerCase()+' '+(a==null&&b==null?'–':(a||0)+(b||0))}).join('')}</p>`;
}
function vsLine(fin){ // ottelutilanne pelattujen väylien perusteella
  const A=GAME.mode==='duo'?GAME.players[0].scores:S.scores,B=GAME.mode==='duo'?GAME.players[1].scores:GAME.cpu;let a=0,b=0,n=0;
  HOLES.forEach((h,i)=>{if(A[i]!=null&&B[i]!=null){a+=A[i];b+=B[i];n++}});if(!n)return'';
  const an=GAME.mode==='duo'?GAME.players[0].name:'Sinä',bn=GAME.mode==='duo'?GAME.players[1].name:'Tietokone';
  const lead=a<b?an:bn,verb=fin?(lead==='Sinä'?' voitit':' voitti'):(lead==='Sinä'?' johdat':' johtaa');
  return `<p style="text-align:center;margin:0"><b>${a===b?(fin?'Tasapeli':'Tasatilanne'):lead+verb+' '+Math.abs(a-b)+' lyönnillä'}</b> (${n} väylää)</p>`.replace('Sinä voitit','Voitit').replace('Sinä johdat','Johdat');
}

function finishHole(capped){
  const n=capped?MAXST:S.strokes,i=S.hole,k=courseKey(),bo=bestOf(k);S.scores[i]=n;
  // tallennus ja avattavat pallot
  const prevBest=bo.holes[i];if(prevBest==null||n<prevBest)bo.holes[i]=n;persist();
  unlock('yellow');if(n<H.par)unlock('orange');if(n<=H.par-2||n===1)unlock('gold');
  if(GAME.mode==='cpu'&&GAME.cpu[i]==null)GAME.cpu[i]=cpuScore(H);
  const duoFirst=GAME.mode==='duo'&&GAME.cur===0,last=i===HOLES.length-1;
  const done=!duoFirst&&last&&S.scores.filter(v=>v!=null).length===HOLES.length;
  if(done||(!duoFirst&&last))clearRound();else saveRound(duoFirst?{hole:i,cur:1}:{hole:i+1,cur:0});
  let tot=0,par=0;S.scores.forEach((v,j)=>{if(v!=null){tot+=v;par+=HOLES[j].par}});
  let extra='';
  const perfLine=done&&S.roundFull?`<p style="text-align:center;margin:0">Täydellisiä osumia ${S.roundPerfect||0}/${S.roundFull} · pisin putki ${SAVE.bestStreak}</p>`:'';
  if(done){unlock('blue');if(k==='fuji')unlock('pink');if(SAVE.bestPerfectRound==null||(S.roundPerfect||0)>SAVE.bestPerfectRound){SAVE.bestPerfectRound=S.roundPerfect||0;persist()}
    if(GAME.mode!=='duo'&&(bo.round==null||tot<bo.round)){bo.round=tot;persist();submitBoard(k,tot);extra='<p style="text-align:center;margin:0">Uusi oma ennätys tälle kentälle!</p>'}}
  const who=GAME.mode==='duo'?GAME.players[GAME.cur].name+': ':'';
  const cpuNote=GAME.mode==='cpu'?`<p style="text-align:center;margin:0">Tietokone: ${GAME.cpu[i]} lyöntiä</p>`:'';
  showOverlay(`<h2>${capped?'Lyöntiraja täynnä':who+resultName(n,H.par)}</h2>
   <p style="text-align:center">Väylä ${i+1}${H.name?' · '+H.name:''} · ${n} lyöntiä, par ${H.par}${prevBest!=null&&GAME.mode!=='duo'?' · aiempi paras '+prevBest:''}</p>${cpuNote}${table()}${vsLine(done)}
   ${done?`<p style="text-align:center"><b>Kierros valmis: ${tot} lyöntiä (${fmtD(tot-par)})</b></p>`:''}${perfLine}${extra}
   <div class="btnrow">${duoFirst?`<button class="cbtn" id="oP2" type="button">${GAME.players[1].name}n vuoro</button>`:done||last?'<button class="cbtn" id="oNew" type="button">Uusi kierros</button>':'<button class="cbtn" id="oNext" type="button">Seuraava väylä</button>'}
   <button class="cbtn alt" id="oAgain" type="button">Pelaa väylä uudelleen</button>
   <button class="cbtn alt" id="oPick" type="button">Valitse väylä</button></div>`);
  $('oPick').onclick=()=>holePicker();
  if(duoFirst)$('oP2').onclick=()=>{setPlayer(1);loadHole(i)};
  else if(done||last)$('oNew').onclick=()=>intro('play');
  else $('oNext').onclick=()=>{if(GAME.mode==='duo')setPlayer(0);loadHole(i+1)};
  $('oAgain').onclick=()=>{S.scores[i]=null;loadHole(i)};
}

const RKEY='kg-round';
function loadRound(){try{const r=JSON.parse(localStorage.getItem(RKEY)||'null');return r&&r.v===1&&COURSES[r.course]&&COURSES[r.course].holes[r.hole]?r:null}catch(e){return null}}
function clearRound(){try{localStorage.removeItem(RKEY)}catch(e){}}
function saveRound(next){ // next = {hole,cur}: väylä valmis, seuraava aloitetaan tiiltä
  const k=courseKey();if(!k)return;const b=S.ball,mid=!next&&S.strokes>0;
  const r={v:1,t:Date.now(),course:k,mode:GAME.mode,diff:GAME.diff,cur:next?next.cur:GAME.cur,hole:next?next.hole:S.hole,
    p:GAME.players.map(p=>p.scores.slice()),cpu:GAME.cpu.slice(),strokes:mid?S.strokes:0,
    ball:mid?{x:b.x,y:b.y}:null,last:mid?{x:S.last.x,y:S.last.y}:null,wind:next?null:{a:S.wind.a,s:S.wind.s},
    st:{rp:S.roundPerfect||0,rf:S.roundFull||0,sk:S.streak||0,sr:S.straightRun||0}};
  try{localStorage.setItem(RKEY,JSON.stringify(r))}catch(e){}}
function roundInfo(r){const C=COURSES[r.course],sc=r.p[r.cur]||[];let d=0,n=0;sc.forEach((v,i)=>{if(v!=null){d+=v-C.holes[i].par;n++}});
  const ago=Math.round((Date.now()-r.t)/60000),when=ago<2?'juuri äsken':ago<60?ago+' min sitten':ago<1440?Math.round(ago/60)+' h sitten':Math.round(ago/1440)+' pv sitten';
  return `${C.name} · väylä ${r.hole+1}${r.strokes?' · lyönti '+(r.strokes+1):''}${n?' · '+fmtD(d):''}${r.mode==='duo'?' · '+GAME.players[r.cur].name:''} · ${when}`}
function continueRound(){const r=loadRound();if(!r){intro('play');return}
  S.fromIntro=false;COURSE=COURSES[r.course];HOLES=COURSE.holes;GAME.mode=r.mode;GAME.diff=r.diff;resetRound();
  GAME.players.forEach((p,i)=>p.scores=(r.p[i]||[]).slice());GAME.cpu=(r.cpu||[]).slice();setPlayer(r.cur);
  S.roundPerfect=r.st.rp;S.roundFull=r.st.rf;S.streak=r.st.sk;S.straightRun=r.st.sr;
  loadHole(r.hole);
  if(r.wind){const s=OPT.wind?r.wind.s:0;S.wind={a:r.wind.a,s,x:Math.sin(r.wind.a)*s,y:Math.cos(r.wind.a)*s};SND.wind=s}
  if(r.strokes&&r.ball){S.strokes=r.strokes;endFly();Object.assign(S.ball,{x:r.ball.x,y:r.ball.y,h:terrain(r.ball.x,r.ball.y),vx:0,vy:0,vh:0,air:false});S.last=r.last||{x:0,y:0};
    if(WORLD&&worldNeedsRegion(S.ball.x,S.ball.y)){worldExtend(S.ball.x,S.ball.y);buildHole();S.ball.h=terrain(S.ball.x,S.ball.y)}
    readyShot(false);snapCamera()}
  saveRound();hud();toast('Kierros jatkuu',roundInfo(r).replace(/ · [^·]*$/,''),2200)}

// ---------- yhteinen tulostaulu (näkyy kaikille, joille sivu on jaettu) ----------
const BOARD={db:null,user:null,uid:null,rows:[],ready:false};
(async()=>{try{if(!window.claude||!claude.use)return;const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db)return;
  BOARD.db=db;BOARD.user=user;BOARD.uid=user?await user.id():null;
  db.collection('board').onSnapshot(s=>{BOARD.rows=s.docs.map(d=>({id:d.id,...d.data()}));BOARD.ready=true;renderBoard()},()=>{BOARD.db=null;renderBoard()});
}catch(e){}})();
async function renderBoard(){
  const box=document.getElementById('boardBox');if(!box)return;if(!BOARD.db){box.innerHTML='';return}
  const parts=[];for(const [k,c] of Object.entries(COURSES)){const list=BOARD.rows.filter(r=>r[k]&&typeof r[k].best==='number').sort((a,b)=>a[k].best-b[k].best).slice(0,5);
    if(list.length)parts.push({k,c,list})}
  if(!BOARD.ready){box.innerHTML='<p class="note">Ladataan tulostaulua…</p>';return}
  const ids=[...new Set(parts.flatMap(p=>p.list.map(r=>r.id)))],ps=ids.length&&BOARD.user?await BOARD.user.profiles(ids):{};
  box.innerHTML='';const h=document.createElement('b');h.style.fontSize='14px';h.textContent='Tulostaulu';box.appendChild(h);
  if(!parts.length){const p=document.createElement('p');p.className='note';p.textContent='Ei vielä tuloksia. Pelaa kokonainen kierros yksin tai tietokonetta vastaan, niin parhaasi tallentuu tähän.';box.appendChild(p);return}
  for(const p of parts){const t=document.createElement('div');t.className='board';const hh=document.createElement('span');hh.className='bh';hh.textContent=p.c.name;t.appendChild(hh);
    const par=p.c.holes.reduce((a,x)=>a+x.par,0);
    p.list.forEach((r,i)=>{const row=document.createElement('div');row.className='brow'+(r.id===BOARD.uid?' me':'');
      const n=document.createElement('span');n.textContent=(i+1)+'. '+((ps[r.id]&&ps[r.id].name)||(r.id===BOARD.uid?'Sinä':'Pelaaja'));
      const v=document.createElement('span');v.textContent=r[p.k].best+' ('+fmtD(r[p.k].best-par)+')';row.append(n,v);t.appendChild(row)});box.appendChild(t)}
}
async function submitBoard(k,tot){if(!BOARD.db||!BOARD.uid)return;try{const ref=BOARD.db.doc('board/'+BOARD.uid),cur=await ref.get(),d=cur.exists?{...cur.data()}:{};
  if(d[k]&&d[k].best<=tot)return;d[k]={best:tot,at:new Date().toISOString().slice(0,10)};await ref.set(d)}catch(e){}}

  const W=innerWidth,Hh=innerHeight;renderer.setPixelRatio(DPR_MAX()*dprScale);renderer.setSize(W,Hh,false);camera.aspect=W/Hh;
  // siirretään kuvan keskipiste ohjauspaneelin yläpuolelle, jotta pelaaja ja pallo eivät jää paneelin alle
  const pr=document.querySelector('.panel').getBoundingClientRect(),ir=document.querySelector('.info').getBoundingClientRect(),
    top=W<Hh*.9?ir.bottom:0,mid=(top+(Hh-pr.height-10))/2,sh=Math.round(Math.max(0,Math.min(Hh*.3,Hh/2-mid+Hh*.07)));
  const FH=Hh+2*sh;camera.aspect=W/FH;camera.fov=2*Math.atan(Math.tan(55*Math.PI/360)*FH/Hh)*180/Math.PI;
  camera.setViewOffset(W,FH,0,2*sh,W,Hh);camera.updateProjectionMatrix();sizeMini()}

let lt=performance.now();
const FT=[];let lastAdapt=0;
function adaptRes(now,raw){ // dynaaminen resoluutio: hidas kone → vähemmän pikseleitä, nopea → takaisin terävämmäksi
  FT.push(raw);if(FT.length>40)FT.shift();if(now-lastAdapt<1500||FT.length<40||document.hidden)return;
  const avg=FT.reduce((a,b)=>a+b,0)/FT.length,old=dprScale;
  if(avg>24&&dprScale>.5)dprScale=Math.max(.5,dprScale-.15);else if(avg<15&&dprScale<1)dprScale=Math.min(1,dprScale+.1);
  if(old!==dprScale){resize();lastAdapt=now;FT.length=0}}
function loop(now){const raw=now-lt,rdt=Math.min(.05,raw/1000);lt=now;adaptRes(now,raw);
  if(S.slowT>0)S.slowT-=rdt;if(S.perfectHold>0){S.perfectHold-=rdt;if(S.perfectHold<=0)setHit()}const dt=S.slowT>0?rdt*.22:rdt; // hidastus täydellisessä osumassa
  if(!S.paused){update(dt);updateGolf(dt);updateFly(dt)}updateCamera(dt);FADE.cam.value.copy(camera.position);WIND.time.value=now/1000;{const w=S.wind,l=Math.hypot(w.x,w.y)||1;WIND.dir.value.set(w.x/l,-w.y/l);WIND.str.value=.25+Math.min(1,(w.s||0)/5)*1.1}S.free?FADE.tgt.value.set(S.free.tx,terrain(S.free.tx,S.free.ty),-S.free.ty):FADE.tgt.value.set(S.ball.x,S.ball.h,-S.ball.y);updateScene();updateFx(dt);updateTracer(dt);followShadow();waterNormal.offset.x+=dt*.012;waterNormal.offset.y+=dt*.007;drawMini();renderAll();requestAnimationFrame(loop)}
